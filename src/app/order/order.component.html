<section class="content">
  <section class="invoice">
  <app-restaurant-order [restaurant]="restaurant"></app-restaurant-order>

    <form [formGroup]="orderForm" novalidate>
      <div class="row">
        <div class="col-xs-12">
          <h2 class="page-header">
            <i class="fa fa-shopping-cart"></i> Finalize o seu pedido
          </h2>
        </div>
      </div>

      <div class="row">
        <div class="col-xs-12">
          <p class="lead">Seus Dados:</p>
        </div>

        <div class="col-sm-6 col-xs-12">
          <app-input-container errorMessage="Campo obrigatório e com 5 caracteres"
                               label="Nome">
            <input formControlName="name" class="form-control"
                   autocomplete="off" placeholder="Nome" />
          </app-input-container>
        </div>

        <div class="col-sm-3 col-xs-6">
          <app-input-container errorMessage="E-mail inválido" label="E-mail">
            <input formControlName="email" class="form-control"
                   autocomplete="off" placeholder="E-mail"/>
          </app-input-container>
        </div>

        <div class="col-sm-3 col-xs-6">
          <app-input-container errorMessage="E-mail inválido" label="Confirmação">
            <input formControlName="emailConfirmation" class="form-control"
                   autocomplete="off" placeholder="Confirmação"/>
          </app-input-container>
        </div>
      </div>

      <div class="row">
        <div class="col-xs-12">
          <p class="lead">Endereço de Entrega:</p>
        </div>
        <div class="col-sm-6 col-xs-12">
          <app-input-container errorMessage="Campo obrigatório e com 5 caracteres" label="Endereço">
            <input formControlName="address" class="form-control"
                   autocomplete="off" placeholder="Rua" />
          </app-input-container>
        </div>
        <div class="col-sm-3 col-xs-6">
          <app-input-container errorMessage="Obrigatório e somente números" label="Número">
            <input formControlName="number" class="form-control"
                   autocomplete="off" placeholder="Número"/>
          </app-input-container>
        </div>
        <div class="col-sm-3 col-xs-6">
          <app-input-container errorMessage="Campo obrigatório" label="Complemento">
            <input formControlName="optionalAddress" class="form-control"
                   placeholder="Complemento" />
          </app-input-container>
        </div>
      </div>

      <!-- Table row -->
      <div class="row">
        <div class="col-xs-12">
          <p class="lead">Itens do Pedido:</p>
        </div>

        <app-order-items [items]="cartItems()"
                         (increaseQty)="increaseQty($event)"
                         (decreaseQty)="decreaseQty($event)"
                         (remove)="remove($event)"
        ></app-order-items>

      </div>
      <!-- /.row -->

      <div class="row">
        <!-- accepted payments column -->
        <div class="col-sm-6 col-xs-12">
          <p class="lead">Formas de Pagamento:</p>

          <div class="form-group">
            <app-radio [options]="paymentOptions" formControlName="paymentOption"></app-radio>

          </div>

        </div>
        <!-- /.col -->
        <div class="col-sm-6 col-xs-12">
          <p class="lead">Total:</p>

          <app-delivery-costs
            [restaurant]="restaurant"
            [itemsValue]="itemsValue()"></app-delivery-costs>
        </div>
        <!-- /.col -->
      </div>

    </form>

    <div class="row">
      <div class="col-xs-12">
        <button (click)="checkOrder(orderForm.value)" class="btn btn-success pull-right"
                [disabled]="orderForm.invalid || cartItems().length === 0">
          <i class="fa fa-credit-card"></i> Concluir Pedido
        </button>
      </div>
    </div>

  </section>
</section>
